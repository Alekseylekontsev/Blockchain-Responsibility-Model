name: Validate BRM artifacts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema PyYAML
      - run: python scripts/validate_brm.py
      - run: python -m pip install 'pytest>=8,<9'
      - run: pytest
