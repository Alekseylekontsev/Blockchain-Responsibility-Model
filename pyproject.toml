[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brm-validation"
version = "0.1.0"
description = "Validation tools for Blockchain Responsibility Model artifacts"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
